
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Skill Swap</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 12px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
            font-size: 14px;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }

        .password-box {
            position: relative;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 7px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #667eea;
        }

        .toggle {
            position: absolute;
            right: 12px;
            top: 14px;
            cursor: pointer;
            color: #667eea;
            font-size: 13px;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #5366d8;
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            font-size: 14px;
            line-height: 1.5;
        }

        .login-link {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #667eea;
            text-decoration: none;
        }

        .login-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Reset Password</h2>

    <p class="subtitle">
        Create a new password for your Skill Swap account.
    </p>

    <form id="resetForm">

        <label for="password">New Password</label>

        <div class="password-box">
            <input
                type="password"
                id="password"
                placeholder="Enter new password"
                minlength="8"
                required
            >
            <span class="toggle"
                  onclick="togglePassword('password', this)">
                Show
            </span>
        </div>

        <label for="confirmPassword">Confirm Password</label>

        <div class="password-box">
            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm new password"
                minlength="8"
                required
            >
            <span class="toggle"
                  onclick="togglePassword('confirmPassword', this)">
                Show
            </span>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">
            Reset Password
        </button>

    </form>

    <p id="message"></p>

    <a href="/login" class="login-link">
        Back to Login
    </a>

</div>

<script>
    // Get token from Gmail reset link
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get("token");

    const form = document.getElementById("resetForm");
    const message = document.getElementById("message");
    const submitBtn = document.getElementById("submitBtn");

    function togglePassword(id, element) {
        const input = document.getElementById(id);

        if (input.type === "password") {
            input.type = "text";
            element.textContent = "Hide";
        } else {
            input.type = "password";
            element.textContent = "Show";
        }
    }

    if (!token) {
        message.style.color = "red";
        message.textContent = "Invalid reset link. Please request a new link.";
        submitBtn.disabled = true;
    }

    form.addEventListener("submit", async function(e) {

        e.preventDefault();

        const password = document.getElementById("password").value;
        const confirmPassword =
            document.getElementById("confirmPassword").value;

        if (!token) {
            message.textContent = "Invalid reset link.";
            return;
        }

        if (password.length < 8) {
            message.style.color = "red";
            message.textContent =
                "Password must contain at least 8 characters.";
            return;
        }

        if (password !== confirmPassword) {
            message.style.color = "red";
            message.textContent = "Passwords do not match.";
            return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "Updating...";

        try {

            const response = await fetch("/api/reset-password", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    token: token,
                    password: password
                })
            });

            const data = await response.json();

            if (response.ok) {

                message.style.color = "green";
                message.textContent =
                    data.message || "Password changed successfully!";

                form.reset();
                submitBtn.textContent = "Password Updated";
                submitBtn.disabled = true;

            } else {

                message.style.color = "red";
                message.textContent =
                    data.message || "Password reset failed.";

                submitBtn.disabled = false;
                submitBtn.textContent = "Reset Password";
            }

        } catch (error) {

            message.style.color = "red";
            message.textContent =
                "Server connection failed. Please try again.";

            submitBtn.disabled = false;
            submitBtn.textContent = "Reset Password";
        }
    });
</script>

</body>
</html>
