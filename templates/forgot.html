
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password - Skill Swap</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{min-height:100vh;display:flex;justify-content:center;align-items:center;background:linear-gradient(135deg,#667eea,#764ba2);padding:20px}
.container{width:100%;max-width:420px;background:white;padding:35px;border-radius:15px;box-shadow:0 8px 25px #0003;text-align:center}
.lock{font-size:55px;margin-bottom:15px}
h2{color:#333;margin-bottom:12px}
p{color:#666;font-size:14px;line-height:1.6;margin-bottom:25px}
.input-box{text-align:left;margin-bottom:20px}
label{display:block;margin-bottom:8px;color:#333;font-weight:bold}
input{width:100%;padding:13px;border:1px solid #ccc;border-radius:7px;outline:none;font-size:15px}
input:focus{border-color:#667eea}
button{width:100%;padding:14px;border:0;border-radius:7px;background:#667eea;color:white;font-size:16px;font-weight:bold;cursor:pointer}
button:hover{background:#5266d5}
button:disabled{opacity:.6;cursor:wait}
#message{margin-top:15px;min-height:20px;font-weight:bold}
.back-link{display:inline-block;margin-top:22px;color:#667eea;text-decoration:none;font-size:14px}
.back-link:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="container">
    <div class="lock">🔐</div>
    <h2>Forgot Password?</h2>
    <p>Enter your registered email address. If email reset is configured, you can receive a secure password reset link.</p>

    <form id="forgotForm">
        <div class="input-box">
            <label for="email">Registered Email Address</label>
            <input type="email" id="email" placeholder="Enter your email" required>
        </div>
        <button type="submit" id="sendButton">Send Reset Link</button>
    </form>

    <div id="message" role="status"></div>
    <a href="/login" class="back-link">← Back to Login</a>
</div>

<script>
document.getElementById("forgotForm").addEventListener("submit", async function(event){
    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const message = document.getElementById("message");
    const button = document.getElementById("sendButton");

    button.disabled = true;
    message.style.color = "#555";
    message.textContent = "Submitting request...";

    try{
        const response = await fetch("/api/forgot-password", {
            method: "POST",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify({email})
        });

        const data = await response.json();

        if(!response.ok){
            throw new Error(data.message || "Request failed.");
        }

        message.style.color = "green";
        message.textContent = data.message || "Request received.";

    }catch(error){
        message.style.color = "red";
        message.textContent = error.message;
    }finally{
        button.disabled = false;
    }
});
</script>
</body>
</html>
