
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skill Swap - Registration</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{min-height:100vh;display:flex;justify-content:center;align-items:center;background:linear-gradient(135deg,#667eea,#764ba2);padding:30px 15px}
.container{width:100%;max-width:500px}
.logo{text-align:center;color:white;margin-bottom:20px}
.logo h1{font-size:38px}.logo span{color:#ffdc73}
.logo p{margin-top:8px}
.register-box{background:white;padding:30px;border-radius:15px;box-shadow:0 10px 30px #0003}
.register-box h2{text-align:center;color:#333;margin-bottom:10px}
.subtitle{text-align:center;color:#777;margin-bottom:25px;font-size:14px}
.input-group{margin-bottom:17px}
.input-group label{display:block;margin-bottom:7px;font-weight:bold;color:#333;font-size:14px}
.input-group input,.input-group select{width:100%;padding:12px;border:1px solid #ccc;border-radius:7px;outline:none;font-size:14px;background:white}
.input-group input:focus,.input-group select:focus{border-color:#667eea}
.password-box{position:relative}
.password-box input{padding-right:60px}
.password-box span{position:absolute;right:12px;top:13px;color:#162e9c;cursor:pointer;font-size:13px}
button{width:100%;padding:13px;border:0;border-radius:7px;background:#667eea;color:white;font-size:16px;font-weight:bold;cursor:pointer;margin-top:10px}
button:hover{background:#5265d5}
button:disabled{opacity:.6;cursor:wait}
#message{text-align:center;margin-top:15px;font-size:14px;min-height:18px}
.login-link{text-align:center;margin-top:20px;font-size:14px;color:#555}
.login-link a{color:#667eea;text-decoration:none;font-weight:bold}
footer{text-align:center;color:white;margin-top:20px;font-size:12px}
@media(max-width:480px){.register-box{padding:22px 18px}}
</style>
</head>
<body>
<div class="container">
    <div class="logo">
        <h1>Skill<span>Swap</span></h1>
        <p>Learn Together. Grow Together.</p>
    </div>

    <div class="register-box">
        <h2>Create Account</h2>
        <p class="subtitle">Join SkillSwap and exchange your skills</p>

        <form id="registerForm">
            <div class="input-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter your full name" required>
            </div>

            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>

            <div class="input-group">
                <label for="mobile">Mobile Number</label>
                <input type="tel" id="mobile" placeholder="Enter 10-digit mobile number"
                       pattern="[0-9]{10}" maxlength="10" required>
            </div>

            <div class="input-group">
                <label for="college">College Name</label>
                <input type="text" id="college" placeholder="Enter college name">
            </div>

            <div class="input-group">
                <label for="teachSkill">Skills You Can Teach</label>
                <select id="teachSkill" required>
                    <option value="">Select a skill</option>
                    <option>Web Development</option>
                    <option>Python Programming</option>
                    <option>Java Programming</option>
                    <option>Graphic Design</option>
                    <option>Photography</option>
                    <option>English Speaking</option>
                    <option>Digital Marketing</option>
                    <option>Database Management</option>
                </select>
            </div>

            <div class="input-group">
                <label for="learnSkill">Skills You Want to Learn</label>
                <select id="learnSkill" required>
                    <option value="">Select a skill</option>
                    <option>Web Development</option>
                    <option>Python Programming</option>
                    <option>Java Programming</option>
                    <option>Graphic Design</option>
                    <option>Photography</option>
                    <option>English Speaking</option>
                    <option>Digital Marketing</option>
                    <option>Database Management</option>
                </select>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <div class="password-box">
                    <input type="password" id="password"
                           autocomplete="new-password"
                           placeholder="Create password (8 characters minimum)" required>
                    <span data-target="password">Show</span>
                </div>
            </div>

            <div class="input-group">
                <label for="confirmPassword">Confirm Password</label>
                <div class="password-box">
                    <input type="password" id="confirmPassword"
                           autocomplete="new-password"
                           placeholder="Confirm password" required>
                    <span data-target="confirmPassword">Show</span>
                </div>
            </div>

            <button type="submit" id="registerButton">Register Now</button>
            <p id="message" role="status"></p>
        </form>

        <div class="login-link">
            Already have an account?
            <a href="/login">Login Here</a>
        </div>
    </div>

    <footer>© 2026 SkillSwap. All Rights Reserved.</footer>
</div>

<script>
document.querySelectorAll(".password-box span").forEach(toggle => {
    toggle.addEventListener("click", function(){
        const field = document.getElementById(this.dataset.target);
        const showing = field.type === "password";
        field.type = showing ? "text" : "password";
        this.textContent = showing ? "Hide" : "Show";
    });
});

document.getElementById("registerForm").addEventListener("submit", async function(event){
    event.preventDefault();

    const get = id => document.getElementById(id).value.trim();
    const message = document.getElementById("message");
    const button = document.getElementById("registerButton");

    const name = get("name");
    const email = get("email");
    const mobile = get("mobile");
    const college = get("college");
    const teach_skill = get("teachSkill");
    const learn_skill = get("learnSkill");
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if(!/^[0-9]{10}$/.test(mobile)){
        message.style.color = "red";
        message.textContent = "Enter a valid 10-digit mobile number.";
        return;
    }

    if(password.length < 8){
        message.style.color = "red";
        message.textContent = "Password must contain at least 8 characters.";
        return;
    }

    if(password !== confirmPassword){
        message.style.color = "red";
        message.textContent = "Passwords do not match.";
        return;
    }

    if(teach_skill.toLowerCase() === learn_skill.toLowerCase()){
        message.style.color = "red";
        message.textContent = "Please select two different skills.";
        return;
    }

    button.disabled = true;
    message.style.color = "#555";
    message.textContent = "Creating your account...";

    try{
        const response = await fetch("/api/register", {
            method: "POST",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify({
                name, email, mobile, college,
                teach_skill, learn_skill, password
            })
        });

        const data = await response.json();

        if(!response.ok){
            throw new Error(data.message || "Registration failed.");
        }

        message.style.color = "green";
        message.textContent = data.message || "Registration successful.";

        this.reset();

        setTimeout(() => {
            window.location.href = "/login";
        }, 1300);

    }catch(error){
        message.style.color = "red";
        message.textContent = error.message;
    }finally{
        button.disabled = false;
    }
});
</script>
</body>
</html>
